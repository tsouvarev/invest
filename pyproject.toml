  "aiogram",
  "async-typer",
  "asyncstdlib",
  "cssselect",
  "funcy",
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "httpx-retries",
  "httpxyz",
  "humanize",
